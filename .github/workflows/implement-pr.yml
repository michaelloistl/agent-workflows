name: Agent Implement PR (reusable)

# Reusable, tracker-agnostic `implement-pr` workflow. A consuming repo's thin
# caller triggers on a PR labelled `agent:implement` and `uses:` this file. The
# agent reads the PR's diff and review comments, makes the requested changes, and
# commits; the sequence pushes (plain git, never --force) and the repo's
# `implement-pr-finalize` hook posts threaded replies. ZERO tracker I/O here.
#
# The PR branch may predate the agent tooling, so the run loads the DEFAULT
# branch's tooling from a detached worktree while the agent commits against the PR
# head. The whole sequence lives in the sequencer, not this YAML (issues #49–#51),
# which hands the ordered sequence to one invocation from the PR head:
#   "$AGENT_WORKFLOWS_BIN" implement-pr   # resolved from $TOOLING_DIR below
# which runs, in order and through the unchanged per-hook dispatcher:
#   guards            preflight (closed PR); non-zero exit is a REFUSAL, not a failure
#   status            report in-progress to the tracker (from the tooling worktree)
#   run               the agent run against the PR head; commits, writes $REPLIES_FILE.
#                     A no-op (nothing to commit) exits non-zero → blocked
#   push-and-finalize plain `git push` of the PR head (never --force; a
#                     non-fast-forward self-reports blocked), then post threaded
#                     replies + summary and report done
#
# One deliberate exception to the collapse: the light guard job stays split (runs
# the SAME sequencer in `--guards-only` mode from a plain default-branch checkout);
# the main job is gated on its result.
on:
  workflow_call:
    inputs:
      system-packages:
        type: string
        default: ""
      database-url:
        type: string
        default: postgres://postgres:postgres@localhost:5432/test
      git-author-name:
        type: string
        default: Sandcastle Agent
      git-author-email:
        type: string
        required: true
      enable-ruby:
        type: boolean
        default: true
      agent-model:
        type: string
        default: ""
      base-branch:
        type: string
        default: ""
        description: Per-run override for the branch this verb bases on / targets. When empty, the config file's baseBranch (if set) then the repository default branch is used (issue #53).
      node-version:
        type: string
        default: ""
        description: Node version (e.g. "20", "lts/*"). When empty, .node-version in the consuming repo is used.
    # Declared explicitly (not `secrets: inherit`) so cross-owner callers can pass
    # them — `inherit` only works when caller and reusable workflow share an owner.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for the Claude Code CLI agent run.
        required: true
      AGENT_PAT:
        description: PAT so pushes/PRs trigger downstream CI; falls back to GITHUB_TOKEN when absent.
        required: false
      RAILS_MASTER_KEY:
        description: Rails master key to decrypt credentials for the test DB and suite.
        required: false

concurrency:
  group: agent-implement-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      refused: ${{ steps.guards.outputs.refused }}
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_STATE: ${{ github.event.pull_request.state }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Run guards (guards-only sequence)
        id: guards
        # The guards-only sequencer exits non-zero on a refusal, so the same
        # exit-code branch as before decides whether the heavy job runs.
        run: |
          if yarn --silent sandcastle:implement-pr-guards-sequence; then
            echo "refused=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused=true" >> "$GITHUB_OUTPUT"
          fi

  implement:
    needs: guard
    if: needs.guard.outputs.refused == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    env:
      # PAT so the push re-triggers downstream CI; falls back to GITHUB_TOKEN.
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve output paths
        run: echo "REPLIES_FILE=$RUNNER_TEMP/replies.json" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          # pull_request_target checks out the base by default; check out the PR's
          # branch by name so the agent's commits can be pushed back to it.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up base-branch tooling worktree
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "TOOLING_DIR=$RUNNER_TEMP/agent-tooling" >> "$GITHUB_ENV"
          # Base branch precedence (issue #53): the per-run override, then the config
          # file's baseBranch (read with jq — the tooling is not installed yet), then
          # the repository default. The tooling worktree tracks the base branch, so a
          # repo whose integration branch is `develop` loads develop's tooling.
          base="$BASE_BRANCH"
          if [ -z "$base" ]; then base="$(jq -r '.baseBranch // empty' .sandcastle/agent-workflows/config.json 2>/dev/null || true)"; fi
          if [ -z "$base" ]; then base="$DEFAULT_BRANCH"; fi
          git fetch --no-tags origin "$base"
          git worktree add --detach "$RUNNER_TEMP/agent-tooling" FETCH_HEAD

      - name: Install system packages
        if: inputs.system-packages != ''
        # The runner's default apt mirror (azure.archive.ubuntu.com) intermittently
        # black-holes connections, and apt's defaults turn that into ~30 min of silent
        # retries with no step ceiling — an agent run that has not yet written a line
        # burning most of a billing hour. So: force IPv4 (the mirror's AAAA records are
        # what stall), cap each request at 15s, and retry the whole thing.
        # `timeout-minutes` is the backstop: fail in 5 and let the label be re-applied,
        # rather than hang.
        #
        # Do NOT narrow the sources with `-o Dir::Etc::sourceparts=/dev/null` to skip
        # the image's pre-configured chrome/microsoft/azure-cli lists. It also drops
        # `universe`, which the runner enables from sources.list.d — consumers asking
        # for anything outside main (libvips, for one) then get `Unable to locate
        # package`, and no CI here would catch it.
        timeout-minutes: 5
        run: |
          apt_run() {
            sudo apt-get "$@" -qq \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::Languages=none
          }
          for attempt in 1 2 3; do
            if apt_run update && apt_run install -y --no-install-recommends ${{ inputs.system-packages }}; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1

      - name: Set up Ruby
        if: inputs.enable-ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install tooling dependencies
        run: yarn --cwd "$TOOLING_DIR" install --frozen-lockfile

      - name: Resolve the tooling dispatcher
        # `node_modules/.bin/agent-workflows` is the symlink yarn creates when
        # `agent-workflows` is installed as a DEPENDENCY — every consuming repo has it,
        # and it stays the path used there. The CENTRAL repo is the package itself, so
        # it never installs itself and the symlink is absent — which killed the AGENT
        # RUN step below with a bare `exit 127`. So this falls back to the package's own
        # `bin/`, letting the central repo run the PR verbs on its own pull requests.
        # Neither present fails HERE with a message naming both paths, rather than as a
        # "No such file or directory" several steps later.
        run: |
          bin="$TOOLING_DIR/node_modules/.bin/agent-workflows"
          if [ ! -x "$bin" ]; then bin="$TOOLING_DIR/bin/agent-workflows.mjs"; fi
          if [ ! -x "$bin" ]; then
            echo "no agent-workflows dispatcher under $TOOLING_DIR (looked in node_modules/.bin and bin/)" >&2
            exit 1
          fi
          echo "AGENT_WORKFLOWS_BIN=$bin" >> "$GITHUB_ENV"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude (bypass permissions, no attribution)
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/settings.json" <<'JSON'
          {
            "permissions": { "defaultMode": "bypassPermissions" },
            "attribution": { "commit": "", "pr": "" }
          }
          JSON

      - name: Configure git identity
        run: |
          git config user.name "${{ inputs.git-author-name }}"
          git config user.email "${{ inputs.git-author-email }}"

      - name: Prepare test database
        if: inputs.enable-ruby
        env:
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec rails db:prepare

      - name: Run implement-pr sequence
        # ONE sequencer invocation runs the whole verb: status in-progress → run →
        # push-and-finalize. The plan pins WHERE each step runs — tracker hooks
        # from the tooling worktree, the agent run and the git push against the PR
        # head — so this launches from the PR working tree via the tooling
        # worktree's packaged dispatcher (the PR branch may predate the tooling). A
        # no-op run or a genuine step failure exits non-zero and trips the blocked
        # report below; a non-fast-forward push self-reports blocked inside the plan.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          REDIS_URL: redis://localhost:6379/0
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          AGENT_MODEL: ${{ inputs.agent-model }}
        run: '"$AGENT_WORKFLOWS_BIN" implement-pr'

      - name: Report blocked on failure
        if: failure()
        run: yarn --cwd "$TOOLING_DIR" sandcastle:implement-pr-status blocked

      - name: Report blocked on cancellation
        if: cancelled()
        run: yarn --cwd "$TOOLING_DIR" sandcastle:implement-pr-status blocked || true
