name: Agent Implement (reusable)

# Reusable, tracker-agnostic `implement` workflow. A consuming repo's thin caller
# triggers on an issue labelled `agent:implement` and `uses:` this file. The agent
# builds the issue on a fresh `agent/…` branch; the sequence pushes the branch
# (plain git — Decision 7) and the repo's `implement-finalize` hook opens the
# draft PR with the right cross-reference. ZERO tracker I/O lives here.
#
# The whole sequence lives in the sequencer, not this YAML (issues #49, #50). This
# workflow keeps only what GitHub Actions alone can do — checkout, toolchain,
# service containers — and hands the ordered sequence to the sequencer:
#   yarn sandcastle:implement-sequence  → agent-workflows implement
# which runs, in order and through the unchanged per-hook dispatcher:
#   guards        preflight (spec / shape / blocked-by / existing-PR); a non-zero
#                 exit is a REFUSAL (not a failure) — the sequencer stops and
#                 exits 0, and the guard has cleared the trigger label already
#   status        report in-progress to the tracker
#   fetch-spec    write the issue spec to $SPEC_FILE; emit branch + base
#   create-branch cut the `agent/…` branch from base (a spec branch for a stacked
#                 tracer-bullet, else the default branch)
#   run           the agent run; commits onto the branch
#   boot-check    (Ruby only) verify a fresh-DB boot on the agent's output (#44)
#   push          plain git push of the branch (Decision 7)
#   finalize      open the PR with the cross-reference and apply the terminal label
#
# One deliberate exception to the collapse: the light guard job stays split, so a
# refusal avoids paying for Ruby and Postgres. It runs the SAME sequencer in
# guards-only mode (`--guards-only`), and the main job is gated on its result.
on:
  workflow_call:
    inputs:
      system-packages:
        type: string
        default: ""
      database-url:
        type: string
        default: postgres://postgres:postgres@localhost:5432/test
      git-author-name:
        type: string
        default: Sandcastle Agent
      git-author-email:
        type: string
        required: true
      enable-ruby:
        type: boolean
        default: true
      agent-model:
        type: string
        default: ""
      base-branch:
        type: string
        default: ""
        description: Per-run override for the branch this verb bases on / targets. When empty, the config file's baseBranch (if set) then the repository default branch is used (issue #53).
      node-version:
        type: string
        default: ""
        description: Node version (e.g. "20", "lts/*"). When empty, .node-version in the consuming repo is used.
    # Declared explicitly (not `secrets: inherit`) so cross-owner callers can pass
    # them — `inherit` only works when caller and reusable workflow share an owner.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for the Claude Code CLI agent run.
        required: true
      AGENT_PAT:
        description: PAT so pushes/PRs trigger downstream CI; falls back to GITHUB_TOKEN when absent.
        required: false
      RAILS_MASTER_KEY:
        description: Rails master key to decrypt credentials for the test DB and suite.
        required: false

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Preflight guards, run in guards-only mode so a refusal is caught before Ruby
  # and Postgres are paid for. A refusal is NOT a failure: the guard hook removes
  # the trigger label and comments why (never `agent:blocked`, reserved for stuck
  # runs), and the guards-only sequencer propagates its non-zero exit so the heavy
  # `implement` job below is skipped.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      refused: ${{ steps.guards.outputs.refused }}
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Run guards (guards-only sequence)
        id: guards
        # The guards-only sequencer exits non-zero on a refusal, so the same
        # exit-code branch as before decides whether the heavy job runs.
        run: |
          if yarn --silent sandcastle:implement-guards-sequence; then
            echo "refused=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused=true" >> "$GITHUB_OUTPUT"
          fi

  implement:
    needs: guard
    if: needs.guard.outputs.refused == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # DB name must match the one in `database-url` (default ends in `/test`).
          # Without this, `db:prepare` connects to a non-existent DB and fails
          # before it can create it.
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    env:
      # PAT so the PR the finalize hook opens triggers downstream CI (GITHUB_TOKEN
      # actions do not); falls back to GITHUB_TOKEN when unset.
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve output paths
        run: echo "SPEC_FILE=$RUNNER_TEMP/spec.md" >> "$GITHUB_ENV"

      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # PAT so the sequence's `git push` is authed to trigger downstream CI.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Install system packages
        if: inputs.system-packages != ''
        # The runner's default apt mirror (azure.archive.ubuntu.com) intermittently
        # black-holes connections, and apt's defaults turn that into ~30 min of silent
        # retries with no step ceiling — an agent run that has not yet written a line
        # burning most of a billing hour. So: force IPv4 (the mirror's AAAA records are
        # what stall), cap each request at 15s, and retry the whole thing.
        # `timeout-minutes` is the backstop: fail in 5 and let the label be re-applied,
        # rather than hang.
        #
        # Do NOT narrow the sources with `-o Dir::Etc::sourceparts=/dev/null` to skip
        # the image's pre-configured chrome/microsoft/azure-cli lists. It also drops
        # `universe`, which the runner enables from sources.list.d — consumers asking
        # for anything outside main (libvips, for one) then get `Unable to locate
        # package`, and no CI here would catch it.
        timeout-minutes: 5
        run: |
          apt_run() {
            sudo apt-get "$@" -qq \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::Languages=none
          }
          for attempt in 1 2 3; do
            if apt_run update && apt_run install -y --no-install-recommends ${{ inputs.system-packages }}; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1

      - name: Set up Ruby
        if: inputs.enable-ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude (bypass permissions, no attribution)
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/settings.json" <<'JSON'
          {
            "permissions": { "defaultMode": "bypassPermissions" },
            "attribution": { "commit": "", "pr": "" }
          }
          JSON

      - name: Configure git identity
        run: |
          git config user.name "${{ inputs.git-author-name }}"
          git config user.email "${{ inputs.git-author-email }}"

      - name: Prepare test database
        if: inputs.enable-ruby
        env:
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec rails db:prepare

      - name: Run implement sequence
        # ONE sequencer invocation runs the whole verb: guards → status →
        # fetch-spec → create-branch → run → boot-check (Ruby) → push → finalize.
        # A guard refusal exits 0 here (not a failure); a genuine step failure
        # exits non-zero and trips the blocked report below. DEFAULT_BRANCH is the
        # base the produced PR falls back to; ENABLE_RUBY gates the boot check.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          REDIS_URL: redis://localhost:6379/0
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          AGENT_MODEL: ${{ inputs.agent-model }}
          ENABLE_RUBY: ${{ inputs.enable-ruby }}
          # Base branch precedence (issue #53): BASE_BRANCH (per-run override) →
          # the config file's baseBranch → DEFAULT_BRANCH (the repository default).
          BASE_BRANCH: ${{ inputs.base-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: yarn sandcastle:implement-sequence

      - name: Report blocked on failure
        if: failure()
        run: yarn sandcastle:implement-status blocked

      - name: Report blocked on cancellation
        if: cancelled()
        run: yarn sandcastle:implement-status blocked || true
