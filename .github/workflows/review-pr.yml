name: Agent Review PR (reusable)

# Reusable, tracker-agnostic `review-pr` workflow. A consuming repo's thin caller
# triggers on a PR labelled `agent:review-pr` and `uses:` this file. The agent
# reviews the PR read-only; the repo's `review-pr-finalize` hook posts the review.
# ZERO tracker I/O lives here.
#
# The PR branch may predate the agent tooling, so the `review-pr` run uses the
# DEFAULT branch's tooling from a detached worktree, with the PR working tree as
# cwd. Tracker-only hooks (guards/status/finalize) run from the tooling dir.
#
# The whole sequence lives in the sequencer, not this YAML (issues #49–#51). This
# workflow keeps only what GitHub Actions alone can do — checkout, the tooling
# worktree, toolchain, service containers — and hands the ordered sequence to one
# sequencer invocation from the PR head:
#   "$TOOLING_DIR/node_modules/.bin/agent-workflows" review-pr
# which runs, in order and through the unchanged per-hook dispatcher, each hook in
# the checkout the plan pins — tracker hooks from the tooling worktree, the agent
# run against the PR head:
#   guards      preflight (closed PR); a non-zero exit is a REFUSAL (not a failure)
#   status      report in-progress to the tracker (from the tooling worktree)
#   run         the read-only agent run against the PR head; writes $REVIEW_FILE
#   finalize    post the review (inline + summary) to the tracker
#   status      report done to the tracker
#
# One deliberate exception to the collapse: the light guard job stays split, so a
# refusal avoids paying for Ruby and Postgres. It runs the SAME sequencer in
# guards-only mode (`--guards-only`) from a plain default-branch checkout, and the
# main job is gated on its result.
on:
  workflow_call:
    inputs:
      system-packages:
        type: string
        default: ""
      database-url:
        type: string
        default: postgres://postgres:postgres@localhost:5432/test
      git-author-email:
        type: string
        required: true
      enable-ruby:
        type: boolean
        default: true
      agent-model:
        type: string
        default: ""
      base-branch:
        type: string
        default: ""
        description: Per-run override for the branch this verb bases on / targets. When empty, the config file's baseBranch (if set) then the repository default branch is used (issue #53).
      node-version:
        type: string
        default: ""
        description: Node version (e.g. "20", "lts/*"). When empty, .node-version in the consuming repo is used.
    # Declared explicitly (not `secrets: inherit`) so cross-owner callers can pass
    # them — `inherit` only works when caller and reusable workflow share an owner.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for the Claude Code CLI agent run.
        required: true
      AGENT_PAT:
        description: PAT so pushes/PRs trigger downstream CI; falls back to GITHUB_TOKEN when absent.
        required: false
      RAILS_MASTER_KEY:
        description: Rails master key to decrypt credentials for the test DB and suite.
        required: false

concurrency:
  group: agent-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      refused: ${{ steps.guards.outputs.refused }}
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_STATE: ${{ github.event.pull_request.state }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Run guards (guards-only sequence)
        id: guards
        # The guards-only sequencer exits non-zero on a refusal, so the same
        # exit-code branch as before decides whether the heavy job runs.
        run: |
          if yarn --silent sandcastle:review-pr-guards-sequence; then
            echo "refused=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: guard
    if: needs.guard.outputs.refused == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      issues: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve output paths
        run: echo "REVIEW_FILE=$RUNNER_TEMP/review.json" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          # pull_request_target checks out the base by default; review the PR's
          # actual code by checking out its head.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up base-branch tooling worktree
        # The PR branch may predate the agent tooling, so run the BASE branch's
        # CURRENT tooling from a detached worktree OUTSIDE the workspace. Review is
        # read-only, so the PR working tree stays pristine either way.
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "TOOLING_DIR=$RUNNER_TEMP/agent-tooling" >> "$GITHUB_ENV"
          # Base branch precedence (issue #53): the per-run override, then the config
          # file's baseBranch (read with jq — the tooling is not installed yet), then
          # the repository default. The tooling worktree tracks the base branch, so a
          # repo whose integration branch is `develop` loads develop's tooling.
          base="$BASE_BRANCH"
          if [ -z "$base" ]; then base="$(jq -r '.baseBranch // empty' .sandcastle/agent-workflows/config.json 2>/dev/null || true)"; fi
          if [ -z "$base" ]; then base="$DEFAULT_BRANCH"; fi
          git fetch --no-tags origin "$base"
          git worktree add --detach "$RUNNER_TEMP/agent-tooling" FETCH_HEAD

      - name: Install system packages
        if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ${{ inputs.system-packages }}

      - name: Set up Ruby
        if: inputs.enable-ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install tooling dependencies
        run: yarn --cwd "$TOOLING_DIR" install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude (bypass permissions, no attribution)
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/settings.json" <<'JSON'
          {
            "permissions": { "defaultMode": "bypassPermissions" },
            "attribution": { "commit": "", "pr": "" }
          }
          JSON

      - name: Prepare test database
        if: inputs.enable-ruby
        env:
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec rails db:prepare

      - name: Run review-pr sequence
        # ONE sequencer invocation runs the whole verb: status in-progress → run →
        # finalize → status done. The plan pins WHERE each step runs — tracker
        # hooks from the tooling worktree, the agent run against the PR head — so
        # this launches from the PR working tree via the tooling worktree's
        # packaged dispatcher (the PR branch may predate the tooling). A genuine
        # step failure exits non-zero and trips the blocked report below.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          REDIS_URL: redis://localhost:6379/0
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          AGENT_MODEL: ${{ inputs.agent-model }}
        run: '"$TOOLING_DIR/node_modules/.bin/agent-workflows" review-pr'

      - name: Report blocked on failure
        if: failure()
        run: yarn --cwd "$TOOLING_DIR" sandcastle:review-pr-status blocked

      - name: Report blocked on cancellation
        if: cancelled()
        run: yarn --cwd "$TOOLING_DIR" sandcastle:review-pr-status blocked || true
