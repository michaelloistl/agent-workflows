name: Agent Explore (reusable)

# Reusable, tracker-agnostic `explore` workflow. A consuming repo's thin caller
# triggers on an issue labelled `agent:explore` and `uses:` this file. The agent
# runs read-only over the codebase; the result is posted by the repo's own
# sandcastle hooks. This file performs ZERO tracker I/O (ADR-0001, Decision 7):
# every issue read/comment/label transition is behind a `sandcastle:explore-*`
# hook the consuming repo implements.
#
# The whole hook sequence lives in the sequencer, not this YAML (issue #49). This
# workflow keeps only what GitHub Actions alone can do — checkout, toolchain,
# service containers — and hands the ordered sequence to ONE sequencer call:
#   yarn sandcastle:explore-sequence  → agent-workflows explore
# which runs, in order and through the unchanged per-hook dispatcher:
#   guards       preflight; a non-zero exit is a REFUSAL (not a failure) — the
#                sequencer stops and exits 0, and the guard has already posted its
#                own explanation and cleared the trigger label
#   status       report in-progress to the tracker
#   fetch-spec   write the issue spec to $SPEC_FILE
#   run          the read-only agent run; writes $COMMENT_FILE
#   finalize     post the exploration comment to the tracker
#   status       report done
on:
  workflow_call:
    inputs:
      system-packages:
        description: Space-separated apt packages to install before the run.
        type: string
        default: ""
      database-url:
        description: DATABASE_URL the agent's feedback loop uses.
        type: string
        default: postgres://postgres:postgres@localhost:5432/test
      git-author-email:
        description: Email for the Sandcastle Agent git identity.
        type: string
        required: true
      enable-ruby:
        description: Install the Ruby toolchain and prepare the test DB (Rails repos).
        type: boolean
        default: true
      agent-model:
        description: Claude model id for the agent run; empty uses the packaged default.
        type: string
        default: ""
      node-version:
        description: Node version (e.g. "20", "lts/*"). When empty, .node-version in the consuming repo is used.
        type: string
        default: ""
    # Declared explicitly (not `secrets: inherit`) so cross-owner callers can pass
    # them — `inherit` only works when caller and reusable workflow share an owner.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for the Claude Code CLI agent run.
        required: true
      AGENT_PAT:
        description: PAT so pushes/PRs trigger downstream CI; falls back to GITHUB_TOKEN when absent.
        required: false
      RAILS_MASTER_KEY:
        description: Rails master key to decrypt credentials for the test DB and suite.
        required: false

concurrency:
  group: agent-explore-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      issues: write
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # Via env, never interpolated into a run script, to avoid shell injection.
      ISSUE_TITLE: ${{ github.event.issue.title }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve output paths
        # runner.temp isn't available in job-level env, so resolve hook file paths
        # here and share them via GITHUB_ENV so every later step sees them.
        run: |
          {
            echo "SPEC_FILE=$RUNNER_TEMP/spec.md"
            echo "COMMENT_FILE=$RUNNER_TEMP/comment.md"
          } >> "$GITHUB_ENV"

      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install system packages
        if: inputs.system-packages != ''
        # The runner's default apt mirror (azure.archive.ubuntu.com) intermittently
        # black-holes connections, and apt's defaults turn that into ~30 min of silent
        # retries with no step ceiling — an agent run that has not yet written a line
        # burning most of a billing hour. So: force IPv4 (the mirror's AAAA records are
        # what stall), cap each request at 15s, bound the index fetch per attempt, and
        # retry. `timeout` is on `update` only — the index fetch is what stalls, and
        # bounding it per attempt is what lets attempts 2 and 3 actually run rather than
        # be cut off mid-flight by the step ceiling. A heavy package set (browser deps,
        # texlive) is legitimately slow to install, so `timeout-minutes` is its only
        # ceiling and is deliberately loose.
        #
        # Failing here is not tidy: this step runs before `Set up Node`, so `Report
        # blocked on failure` runs without `node_modules` and fails too — a red run, no
        # `agent:blocked` state label, and the trigger label still on the issue, which a
        # human has to REMOVE and re-add to fire another run (re-adding a label that is
        # already there raises no event). Still better than the silent half-hour hang it
        # replaces, which was billed in full.
        #
        # Do NOT narrow the sources with `-o Dir::Etc::sourceparts=/dev/null` to skip the
        # image's pre-configured chrome/microsoft/azure-cli lists: on 24.04 that directory
        # also holds `ubuntu.sources`, the entire Ubuntu archive (`/etc/apt/sources.list`
        # is only a comment stub), so apt is left with no sources at all and can locate
        # nothing that is not already on the image.
        timeout-minutes: 10
        env:
          # Via env, never interpolated into the run script, to avoid shell injection.
          # The expansion below stays unquoted so a space-separated list still splits.
          SYSTEM_PACKAGES: ${{ inputs.system-packages }}
        run: |
          apt_opts=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::Languages=none
          )
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update -qq "${apt_opts[@]}" &&
              sudo apt-get install -q -y --no-install-recommends "${apt_opts[@]}" \
                $SYSTEM_PACKAGES; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} of 3 failed"
            sleep 5
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Set up Ruby
        if: inputs.enable-ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install Claude Code CLI
        # sandcastle's noSandbox() runs the `claude` CLI directly on the runner.
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude (bypass permissions, no attribution)
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/settings.json" <<'JSON'
          {
            "permissions": { "defaultMode": "bypassPermissions" },
            "attribution": { "commit": "", "pr": "" }
          }
          JSON

      - name: Prepare test database
        if: inputs.enable-ruby
        env:
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec rails db:prepare

      - name: Run explore sequence
        # ONE sequencer invocation runs the whole verb: guards → status →
        # fetch-spec → run → finalize → status. A guard refusal exits 0 here
        # (not a failure); a genuine step failure exits non-zero and trips the
        # blocked report below.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RAILS_ENV: test
          DATABASE_URL: ${{ inputs.database-url }}
          REDIS_URL: redis://localhost:6379/0
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          AGENT_MODEL: ${{ inputs.agent-model }}
        run: yarn sandcastle:explore-sequence

      - name: Report blocked on failure
        if: failure()
        run: yarn sandcastle:explore-status blocked

      - name: Report blocked on cancellation
        if: cancelled()
        run: yarn sandcastle:explore-status blocked || true
