name: Agent Implement spec (reusable)

# Reusable, tracker-agnostic spec *orchestrator* (CONTEXT.md). It runs NO agent —
# it sequences the `implement` verb across a spec's tracer-bullets on a shared spec
# branch, strictly sequentially (ADR-0003). A consuming repo wires two thin
# callers: one on the spec-issue label (`mode: kickoff`), one on PR-merge
# (`mode: advance`). ZERO tracker I/O lives here — all graph/`gh` logic is behind
# the `implement-spec-<mode>` hooks. Lightweight: node + `gh` only, no
# postgres/redis/ruby (nothing to build).
#
# The sequence lives in the sequencer, not this YAML (issue #52). The run job hands
# the mode to the sequencer, which runs the orchestrator's short plan — a single
# `kickoff` or `advance` hook — through the unchanged per-hook dispatcher:
#   SPEC_MODE=<mode> yarn sandcastle:implement-spec-sequence
#
#   kickoff  cut the spec branch, dispatch the topologically-first tracer-bullet
#   advance  (added in #8) on a slice PR merge: close it, dispatch the next, or
#            open the final spec→default PR
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      git-author-name:
        type: string
        default: Sandcastle Agent
      git-author-email:
        type: string
        required: true
      node-version:
        type: string
        default: ""
        description: Node version (e.g. "20", "lts/*"). When empty, .node-version in the consuming repo is used.
      base-branch:
        type: string
        default: ""
        description: Per-run override for the branch the spec branch is cut from and the final spec PR targets. When empty, the config file's baseBranch (if set) then the repository default branch is used (issue #53).
    # Declared explicitly (not `secrets: inherit`) so cross-owner callers can pass
    # it — `inherit` only works when caller and reusable workflow share an owner.
    # spec orchestration runs no agent and touches no DB, so only the PAT is needed.
    secrets:
      AGENT_PAT:
        description: PAT so dispatched workflows and PR/issue ops trigger downstream CI.
        required: false

concurrency:
  # Serialise the events that can actually race for one spec: two advances (both
  # keyed on the merged PR's base spec branch) and a double-kickoff (both keyed on
  # the spec issue number). Kickoff and advance use different keys, but they never
  # overlap in time — kickoff finishes in seconds; the first slice it dispatches
  # only merges (→ advance) much later.
  group: implement-spec-${{ github.event.issue.number || github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  # Preflight for BOTH modes. A refusal exits non-zero so the run job is skipped —
  # NOT a failure, never `agent:blocked`; on kickoff it also retires the trigger
  # label + comments why.
  #
  # advance is guarded too (it used to be unguarded, on the reasoning that it merely
  # reacts to a merge). The attended slice loop merges slice PRs into the spec branch
  # itself, so a local merge fires this workflow, and advance would then label the
  # NEXT tracer-bullet `agent:implement` — starting in CI the very slice the local
  # loop is about to build. The advance guard reads the local-run marker on the spec
  # issue and stands down while a local run holds it. It needs BASE_REF (there is no
  # ISSUE_NUMBER on a PR event); the spec number comes from that branch name.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      refused: ${{ steps.guards.outputs.refused }}
    env:
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SPEC_MODE: ${{ inputs.mode }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Run guards
        id: guards
        run: |
          if yarn --silent sandcastle:implement-spec-guards; then
            echo "refused=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: [guard]
    # Both modes are guarded, so this is a plain "the guard did not refuse" gate: a
    # refusal (or a guard job that could not complete) skips the orchestration.
    if: needs.guard.outputs.refused == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # PAT so a branch/PR the orchestrator pushes triggers downstream CI; falls
      # back to GITHUB_TOKEN when unset.
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      # Base branch the orchestrator cuts the spec branch from and targets the final
      # spec PR at: BASE_BRANCH (per-run override) → the config file's baseBranch →
      # DEFAULT_BRANCH (the repository default). kickoff/advance resolve this (#53).
      BASE_BRANCH: ${{ inputs.base-branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # PAT so the orchestrator's `git push` is authed (and triggers CI).
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
          cache: yarn
      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
      - name: Configure git identity
        run: |
          git config user.name "${{ inputs.git-author-name }}"
          git config user.email "${{ inputs.git-author-email }}"
      - name: Orchestrate
        # ONE sequencer invocation runs the orchestrator's (short) sequence: the
        # single `kickoff` or `advance` hook, selected by SPEC_MODE. No agent and no
        # database services — the whole shape lives in the sequencer (issue #52).
        env:
          SPEC_MODE: ${{ inputs.mode }}
        run: yarn sandcastle:implement-spec-sequence
